name: Build Android APK

# Build an installable, debug-signed release APK and expose it as a
# downloadable workflow artifact. Runs automatically on every push to main
# (e.g. when a PR is merged) and can also be started manually from the Actions
# tab ("Run workflow"). No repository secrets are required: the release variant
# is signed with the committed android/app/debug.keystore via -P properties, so
# the APK is a standalone build (JS bundled into Hermes bytecode, no Metro
# needed) suitable for sideloading onto a device for testing.
on:
  push:
    branches: [main, claude/game-screen-position-settings-svkxru]
  workflow_dispatch:
    inputs:
      abi:
        description: 'Target ABI (arm64-v8a covers virtually all modern phones; the push-triggered build always uses the universal set below regardless of this default, since that one is what real users sideload)'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - 'armeabi-v7a,arm64-v8a'
          - x86_64
          - 'armeabi-v7a,arm64-v8a,x86,x86_64'

# A newer push to the same ref supersedes an in-progress build.
concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Runs on Linux: fast, plentiful runners (macOS-hosted runners queue slowly
    # and the macos-13 image is being retired).
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Needed to publish the built APK as a GitHub Release asset (see below).
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Override the action's default `tools platform-tools`: the legacy
          # standalone "tools" package has been removed from Google's SDK
          # repository, so installing it now fails every run with "Failed to
          # find package 'tools'". We only ever need platform-tools here --
          # the specific platform/build-tools/NDK versions are installed
          # explicitly in the next step.
          packages: 'platform-tools'

      - name: Install Android SDK packages (NDK 23.1.7779620)
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;23.1.7779620" \
            "cmake;3.30.5"

      # android/chiaki/ (the vendored chiaki-ng/Pylux engine for PS Plus cloud
      # streaming) needs protoc (or Python's grpc_tools.protoc) on PATH to
      # compile takion.proto, plus Python's protobuf package regardless of
      # which of the two produces the intermediate file -- see
      # android/chiaki/README.md's "Build prerequisites".
      - name: Install protobuf compiler (for PS Plus native build)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          pip install protobuf

      - name: Install JS dependencies
        run: yarn install --immutable

      # Stamp the CI run number into the bundle so the in-app updater can tell
      # whether the rolling "latest" release (named "Latest APK (build <n>)")
      # is newer than the installed build.
      - name: Stamp CI build number
        run: echo "export const BUILD_NUMBER = ${{ github.run_number }};" > src/shared/lib/buildInfo.ts

      - name: Build release APK (debug-signed)
        working-directory: android
        env:
          # Manual (workflow_dispatch) runs use whatever ABI the caller picked,
          # for fast iteration. The push-triggered build -- the one that
          # produces xstreaming-latest.apk, i.e. what a real user actually
          # downloads and sideloads via the in-app updater -- always builds
          # the full ABI set regardless: some Google TV / Android TV boxes are
          # x86_64 (or 32-bit x86/armeabi-v7a), not arm64-v8a, and an
          # arm64-v8a-only APK fails to install on those with a bare "this app
          # isn't compatible with your device" and no further explanation.
          TARGET_ABI: ${{ github.event_name == 'push' && 'armeabi-v7a,arm64-v8a,x86,x86_64' || (inputs.abi || 'arm64-v8a') }}
        # android/build.gradle's Aliyun mirrors (ahead of Maven Central, for
        # faster resolution from some networks) occasionally answer a
        # transient 502 during the very first dependency-resolution pass,
        # which fails the whole build before a single module compiles even
        # though the mirror is back within seconds. Retry a couple of times
        # rather than losing the entire (otherwise successful) build to one
        # flaky resolve.
        run: |
          for attempt in 1 2 3; do
            if ./gradlew assembleProdRelease --no-daemon \
              -PreactNativeArchitectures="${TARGET_ABI}" \
              -PXSTREAMING_RELEASE_STORE_FILE=debug.keystore \
              -PXSTREAMING_RELEASE_STORE_PASSWORD=android \
              -PXSTREAMING_RELEASE_KEY_ALIAS=androiddebugkey \
              -PXSTREAMING_RELEASE_KEY_PASSWORD=android; then
              exit 0
            fi
            echo "Gradle build attempt ${attempt} failed; retrying in 30s..."
            sleep 30
          done
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xstreaming-prod-release-apk
          path: android/app/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error

      # GitHub always zips workflow artifacts, so downloading the artifact above
      # yields a .zip. To get the raw .apk with a single click, also publish it
      # as a GitHub Release asset (release assets download unwrapped). This uses
      # a rolling "latest" pre-release so the download URL stays stable:
      #   https://github.com/<owner>/<repo>/releases/download/latest/xstreaming-latest.apk
      #
      # main-only: this "latest" release is what real users' in-app updater
      # polls, so a push-triggered build on any other branch (added to the
      # trigger above for pre-merge CI validation) must still build and
      # upload the artifact above, but must never overwrite the release
      # real users auto-update from with unreviewed/unmerged code.
      - name: Stage APK for release
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          apk="$(ls android/app/build/outputs/apk/prod/release/*.apk | head -n1)"
          cp "$apk" "dist/xstreaming-latest.apk"

      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK (build ${{ github.run_number }})
          body: |
            Automated debug-signed release APK (sideload build).

            - Commit: ${{ github.sha }}
            - Built from: ${{ github.ref_name }}

            Download **xstreaming-latest.apk** below and install it directly on
            your device (no unzip needed).
          prerelease: true
          make_latest: false
          files: dist/xstreaming-latest.apk
